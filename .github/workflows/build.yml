name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libffi-dev libssl-dev build-essential
        python -m pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer

    - name: Create Google Key File
      run: |
        echo "${{ secrets.GOOGLE_KEY_JSON }}" > replacement-463907-07ae6e152f37.json

    - name: Build with Buildozer
      env:
        ANDROID_NDK_HOME: ''
        ANDROID_NDK_LATEST_HOME: ''
        ANDROID_NDK_ROOT: ''
      run: |
        buildozer android clean
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WMS-App-APK
        path: bin/*.apk
