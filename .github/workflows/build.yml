name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Google Key File
      run: |
        echo "${{ secrets.GOOGLE_KEY_JSON }}" > replacement-463907-07ae6e152f37.json

    - name: Build with Buildozer Action
      uses: ArtemisS3/action-buildozer@v1
      with:
        command: buildozer -v android debug
        subpath: '.'

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WMS-App-APK
        path: bin/*.apk
